[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
[program:rust]
command=/usr/local/bin/mbox
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:node]
command=node /app/K45movies-api/bridge-server.js
directory=/app/K45movies-api
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=20
environment=NODE_ENV="production",PORT="3002"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
